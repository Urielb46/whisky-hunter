/* ── EXCHANGE RATES & CONSTANTS ── */
const FX = { GBP: 4.78, USD: 3.73, EUR: 4.07, ILS: 1 };
const EXCISE_PER_LITER_PA = 123; // ₪ per liter of pure alcohol

function calcIsraelCost(p, abv, vol = 700) {
  const r = FX[p.currency] || 3.73;
  const prod = p.price * r;
  const ship = p.shipping * r;
  const cif = prod + ship;
  const excise = (vol / 1000) * (abv / 100) * EXCISE_PER_LITER_PA;
  const customs = p.country === 'US' ? cif * 1.0 : 0;
  const vat = (cif + excise + customs) * 0.17;
  const total = cif + excise + customs + vat;
  return {
    prod: Math.round(prod), ship: Math.round(ship), cif: Math.round(cif),
    excise: Math.round(excise), customs: Math.round(customs), vat: Math.round(vat),
    total: Math.round(total)
  };
}

function bestPrice(w) {
  let best = Infinity, bestP = null;
  w.prices.forEach(p => {
    const c = calcIsraelCost(p, w.abv);
    if (c.total < best) { best = c.total; bestP = p; }
  });
  return { cost: best, retailer: bestP };
}

/* ── HELPERS ── */
const ALL_TYPES = [...new Set(DB.map(w=>w.type))];
const ALL_COUNTRIES = [...new Set(DB.map(w=>w.country))];
const ALL_REGIONS = [...new Set(DB.map(w=>w.region))];
const ALL_FLAVORS = [...new Set(DB.flatMap(w=>w.flavor))].sort();
const ALL_CASKS = [...new Set(DB.flatMap(w=>w.cask))].sort();

function flavorClass(f) { return FLAVOR_CLASSES[f] || 'flavor-default'; }

function ratingColor(r) {
  if (r >= 95) return '#d4a017';
  if (r >= 92) return '#c47f12';
  if (r >= 88) return '#b89060';
  return '#9a7c5a';
}

function peatScore(flavors) {
  const smoky = ['Smoky','Peaty','Maritime','Medicinal'];
  return flavors.filter(f => smoky.includes(f)).length;
}

/* ── FLAVOR PILL ── */
function FlavorPill({ f }) {
  return <span className={`badge ${flavorClass(f)}`} style={{marginInlineEnd:'4px',marginBottom:'4px'}}>{f}</span>;
}

/* ── PEAT BAR ── */
function PeatBar({ score }) {
  const pct = Math.min(100, (score / 4) * 100);
  return (
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <span style={{fontSize:'.68rem',color:'#9a7c5a',width:28}}>🔥{score}</span>
      <div style={{flex:1,height:4,background:'#2d1600',borderRadius:2,overflow:'hidden'}}>
        <div className="peat-bar-fill" style={{width:`${pct}%`}}/>
      </div>
    </div>
  );
}

/* ── FILTER PANEL ── */
function FilterPanel({ filters, setFilters, onReset }) {
  function toggle(key, val) {
    setFilters(f => {
      const arr = f[key];
      return { ...f, [key]: arr.includes(val) ? arr.filter(x=>x!==val) : [...arr, val] };
    });
  }
  return (
    <div style={{padding:'14px 12px',overflowY:'auto',height:'100%',fontSize:'.8rem'}}>
      {/* Search */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>🔍 חיפוש חופשי</div>
        <input type="text" placeholder="שם, מזקקה, אזור..." value={filters.search}
          onChange={e=>setFilters(f=>({...f,search:e.target.value}))} />
      </div>

      {/* Type */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>📦 סוג וויסקי</div>
        {ALL_TYPES.map(t=>(
          <label key={t} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,cursor:'pointer',color:filters.types.includes(t)?'#e8d5b0':'#9a7c5a'}}>
            <input type="checkbox" checked={filters.types.includes(t)} onChange={()=>toggle('types',t)} />
            {TYPE_LABELS[t]||t}
          </label>
        ))}
      </div>

      {/* Country */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>🌍 מדינה</div>
        {ALL_COUNTRIES.map(c=>(
          <label key={c} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,cursor:'pointer',color:filters.countries.includes(c)?'#e8d5b0':'#9a7c5a'}}>
            <input type="checkbox" checked={filters.countries.includes(c)} onChange={()=>toggle('countries',c)} />
            {COUNTRY_FLAG[c]||''} {c}
          </label>
        ))}
      </div>

      {/* Age */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>⏳ גיל (שנים): {filters.minAge}–{filters.maxAge}</div>
        <div style={{marginBottom:4}}>
          <label style={{fontSize:'.72rem',color:'#9a7c5a'}}>מינימום</label>
          <input type="range" min={0} max={35} value={filters.minAge}
            onChange={e=>setFilters(f=>({...f,minAge:+e.target.value}))} />
        </div>
        <div>
          <label style={{fontSize:'.72rem',color:'#9a7c5a'}}>מקסימום</label>
          <input type="range" min={0} max={35} value={filters.maxAge}
            onChange={e=>setFilters(f=>({...f,maxAge:+e.target.value}))} />
        </div>
        <label style={{display:'flex',alignItems:'center',gap:6,marginTop:6,cursor:'pointer',color:'#9a7c5a'}}>
          <input type="checkbox" checked={filters.includeNAS} onChange={e=>setFilters(f=>({...f,includeNAS:e.target.checked}))} />
          כלול NAS (ללא גיל)
        </label>
      </div>

      {/* ABV */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>🥃 ABV: {filters.minAbv}%–{filters.maxAbv}%</div>
        <div style={{marginBottom:4}}>
          <label style={{fontSize:'.72rem',color:'#9a7c5a'}}>מינימום</label>
          <input type="range" min={40} max={65} value={filters.minAbv}
            onChange={e=>setFilters(f=>({...f,minAbv:+e.target.value}))} />
        </div>
        <div>
          <label style={{fontSize:'.72rem',color:'#9a7c5a'}}>מקסימום</label>
          <input type="range" min={40} max={65} value={filters.maxAbv}
            onChange={e=>setFilters(f=>({...f,maxAbv:+e.target.value}))} />
        </div>
      </div>

      {/* Price */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>💰 מחיר מקסימלי בישראל: ₪{filters.maxPrice}</div>
        <input type="range" min={200} max={3000} step={50} value={filters.maxPrice}
          onChange={e=>setFilters(f=>({...f,maxPrice:+e.target.value}))} />
      </div>

      {/* Rating */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>⭐ דירוג מינימלי: {filters.minRating}</div>
        <input type="range" min={80} max={100} value={filters.minRating}
          onChange={e=>setFilters(f=>({...f,minRating:+e.target.value}))} />
      </div>

      {/* Flavors */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>👅 פרופיל טעם</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
          {ALL_FLAVORS.map(fl=>(
            <span key={fl} onClick={()=>toggle('flavors',fl)}
              className={`badge ${filters.flavors.includes(fl)?flavorClass(fl):'flavor-default'}`}
              style={{cursor:'pointer',opacity:filters.flavors.includes(fl)?1:0.5}}>
              {fl}
            </span>
          ))}
        </div>
      </div>

      {/* Casks */}
      <div className="filter-section">
        <div style={{color:'#d4a017',fontWeight:600,marginBottom:8}}>🛢 סוג חבית</div>
        {ALL_CASKS.map(c=>(
          <label key={c} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,cursor:'pointer',color:filters.casks.includes(c)?'#e8d5b0':'#9a7c5a'}}>
            <input type="checkbox" checked={filters.casks.includes(c)} onChange={()=>toggle('casks',c)} />
            {c}
          </label>
        ))}
      </div>

      <button className="ghost-btn" style={{width:'100%',marginTop:4}} onClick={onReset}>↺ אפס סינונים</button>
    </div>
  );
}

/* ── WHISKY CARD ── */
function WhiskyCard({ w, onOpen, onCompare, inCompare }) {
  const bp = useMemo(() => bestPrice(w), [w]);
  const ps = peatScore(w.flavor);
  const initials = w.distillery.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  return (
    <div className="card-hover fade-up" onClick={()=>onOpen(w)}
      style={{background:'#2d1600',border:'1px solid #4a2800',borderRadius:10,padding:'14px 16px',cursor:'pointer',position:'relative'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}}>
        <div style={{width:44,height:44,borderRadius:8,background:'#1a0a00',border:'1px solid #4a2800',
          display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
          fontSize:'1rem',fontWeight:700,color:'#d4a017'}}>
          {COUNTRY_FLAG[w.country]||initials}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:'.92rem',color:'#e8d5b0',marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{w.name}</div>
          <div style={{fontSize:'.75rem',color:'#9a7c5a'}}>{w.distillery} • {w.region}</div>
        </div>
        <div style={{textAlign:'center',flexShrink:0}}>
          <div style={{fontSize:'1.1rem',fontWeight:800,color:ratingColor(w.rating)}}>{w.rating}</div>
          <div style={{fontSize:'.62rem',color:'#9a7c5a'}}>נקודות</div>
        </div>
      </div>

      {/* Tags row */}
      <div style={{display:'flex',gap:5,marginBottom:8,flexWrap:'wrap'}}>
        <span className="badge" style={{background:'#1a0a00',color:'#b89060'}}>{TYPE_LABELS[w.type]||w.type}</span>
        {w.age > 0 && <span className="badge" style={{background:'#221000',color:'#d4a017'}}>{w.age}y</span>}
        {w.age === 0 && <span className="badge" style={{background:'#221000',color:'#9a7c5a'}}>NAS</span>}
        <span className="badge" style={{background:'#221000',color:'#b89060'}}>{w.abv}%</span>
      </div>

      {/* Peat */}
      {ps > 0 && <div style={{marginBottom:8}}><PeatBar score={ps} /></div>}

      {/* Flavors */}
      <div style={{display:'flex',flexWrap:'wrap',marginBottom:10}}>
        {w.flavor.slice(0,4).map(f=><FlavorPill key={f} f={f} />)}
        {w.flavor.length > 4 && <span style={{fontSize:'.68rem',color:'#9a7c5a',alignSelf:'center'}}>+{w.flavor.length-4}</span>}
      </div>

      {/* Price */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:'.7rem',color:'#9a7c5a'}}>מחיר בישראל</div>
          <div style={{fontWeight:700,color:'#d4a017',fontSize:'1rem'}}>₪{bp.cost.toLocaleString()}</div>
          <div style={{fontSize:'.65rem',color:'#9a7c5a'}}>{bp.retailer?.retailer}</div>
        </div>
        <button className={`compare-btn ${inCompare?'active':''}`}
          onClick={e=>{e.stopPropagation();onCompare(w);}}>
          {inCompare ? '✓ בהשוואה' : '+ השווה'}
        </button>
      </div>
    </div>
  );
}

/* ── PRICE TABLE ── */
function PriceTable({ w }) {
  const rows = w.prices.map(p => ({
    ...p,
    cost: calcIsraelCost(p, w.abv)
  }));
  const minTotal = Math.min(...rows.map(r=>r.cost.total));
  return (
    <div style={{overflowX:'auto'}}>
      <table>
        <thead>
          <tr>
            <th>חנות</th>
            <th>מדינה</th>
            <th>מחיר מקורי</th>
            <th>משלוח</th>
            <th>מחיר + משלוח ₪</th>
            <th>בלו ₪</th>
            <th>מכס ₪</th>
            <th>מע"מ ₪</th>
            <th>סה"כ ₪</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {rows.sort((a,b)=>a.cost.total-b.cost.total).map(r=>(
            <tr key={r.retailer} style={r.cost.total===minTotal?{background:'#221000'}:{}}>
              <td style={{fontWeight:r.cost.total===minTotal?700:400,color:r.cost.total===minTotal?'#d4a017':'#e8d5b0'}}>{r.retailer}</td>
              <td>{r.country}</td>
              <td style={{direction:'ltr'}}>{r.currency} {r.price}</td>
              <td style={{direction:'ltr'}}>{r.currency} {r.shipping}</td>
              <td>{r.cost.cif.toLocaleString()}</td>
              <td>{r.cost.excise.toLocaleString()}</td>
              <td>{r.cost.customs > 0 ? r.cost.customs.toLocaleString() : '—'}</td>
              <td>{r.cost.vat.toLocaleString()}</td>
              <td className={r.cost.total===minTotal?'price-best':''}>{r.cost.total.toLocaleString()}</td>
              <td>
                <a href={r.url} target="_blank" rel="noopener noreferrer"
                  style={{color:'#d4a017',textDecoration:'none',fontSize:'.75rem'}}
                  onClick={e=>e.stopPropagation()}>
                  קנה ↗
                </a>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{marginTop:10,padding:'8px 12px',background:'#221000',borderRadius:6,fontSize:'.75rem',color:'#9a7c5a'}}>
        <strong style={{color:'#d4a017'}}>הסבר חישוב:</strong> מחיר + משלוח → בלו (₪{EXCISE_PER_LITER_PA}/ל׳ אלכוהול טהור) → מכס (0% UK/EU FTA, 100% USA) → מע"מ 17%
      </div>
    </div>
  );
}

/* ── COST CALCULATOR ── */
function CostCalc({ w }) {
  const [selRetailer, setSelRetailer] = useState(0);
  const [vol, setVol] = useState(700);
  const p = w.prices[selRetailer];
  const cost = calcIsraelCost(p, w.abv, vol);
  const rows = [
    {label:'מחיר מקורי',val:`${p.currency} ${p.price}  →  ₪${cost.prod.toLocaleString()}`},
    {label:'משלוח',val:`${p.currency} ${p.shipping}  →  ₪${cost.ship.toLocaleString()}`},
    {label:'CIF (מחיר + משלוח)',val:`₪${cost.cif.toLocaleString()}`},
    {label:`בלו (${vol}מל × ${w.abv}% × ₪${EXCISE_PER_LITER_PA})`,val:`₪${cost.excise.toLocaleString()}`},
    {label:`מכס ${p.country==='US'?'100% (ארה"ב)':'0% (FTA)'}`,val:cost.customs>0?`₪${cost.customs.toLocaleString()}`:'פטור'},
    {label:'מע"מ 17%',val:`₪${cost.vat.toLocaleString()}`},
  ];
  return (
    <div>
      <div style={{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:160}}>
          <label style={{fontSize:'.75rem',color:'#9a7c5a',display:'block',marginBottom:4}}>חנות</label>
          <select value={selRetailer} onChange={e=>setSelRetailer(+e.target.value)}>
            {w.prices.map((p,i)=><option key={i} value={i}>{p.retailer} ({p.country})</option>)}
          </select>
        </div>
        <div style={{flex:1,minWidth:120}}>
          <label style={{fontSize:'.75rem',color:'#9a7c5a',display:'block',marginBottom:4}}>נפח (מל)</label>
          <select value={vol} onChange={e=>setVol(+e.target.value)}>
            {[200,350,500,700,1000].map(v=><option key={v} value={v}>{v}מל</option>)}
          </select>
        </div>
      </div>

      <table>
        <tbody>
          {rows.map(r=>(
            <tr key={r.label}>
              <td style={{color:'#9a7c5a',width:'60%'}}>{r.label}</td>
              <td style={{fontWeight:500}}>{r.val}</td>
            </tr>
          ))}
          <tr style={{borderTop:'2px solid #4a2800'}}>
            <td style={{fontWeight:700,color:'#d4a017',fontSize:'1rem'}}>סה"כ בישראל</td>
            <td style={{fontWeight:800,color:'#d4a017',fontSize:'1.1rem'}}>₪{cost.total.toLocaleString()}</td>
          </tr>
        </tbody>
      </table>

      <div style={{marginTop:16}}>
        <a href={p.url} target="_blank" rel="noopener noreferrer"
          style={{display:'inline-flex',alignItems:'center',gap:6}}>
          <button className="gold-btn">🛒 לרכישה ב-{p.retailer} ↗</button>
        </a>
      </div>
    </div>
  );
}

function CompareBar({ compare, onRemove, onOpen, onClear }) {
  if (compare.length === 0) return null;
  return (
    <div className="compare-bar">
      <span style={{color:'#9a7c5a',fontSize:'.8rem',flexShrink:0}}>📊 השוואה:</span>
      {compare.map(w=>(
        <div key={w.id} style={{display:'flex',alignItems:'center',gap:5,background:'#2d1600',borderRadius:6,padding:'4px 8px'}}>
          <span style={{fontSize:'.78rem',color:'#e8d5b0'}}>{w.name}</span>
          <button onClick={()=>onRemove(w)} style={{background:'transparent',border:'none',color:'#9a7c5a',cursor:'pointer',fontSize:'.9rem',lineHeight:1}}>✕</button>
        </div>
      ))}
      <button className="gold-btn" disabled={compare.length<2} onClick={onOpen}>השווה →</button>

}

  const maxRating = Math.max(...whiskies.map(w=>w.rating));

  const rows = [
    { label:'🏭 מזקקה', val: w => w.distillery },
    { label:'🌍 מדינה', val: w => `${COUNTRY_FLAG[w.country]||''} ${w.country}` },
    { label:'📍 אזור', val: w => w.region },
    { label:'📦 סוג', val: w => TYPE_LABELS[w.type]||w.type },
    { label:'⏳ גיל', val: w => w.age > 0 ? `${w.age} שנה` : 'NAS' },
    { label:'🥃 ABV', val: w => `${w.abv}%` },
    { label:'⭐ דירוג', val: w => w.rating, highlight: (v, w) => w.rating === maxRating },
    { label:'🔥 עוצמת עשן', val: w => {

    { label:'💰 מחיר ישראל (הטוב ביותר)', val: w => {
        const bp = bestPrice(w);
        return `₪${bp.cost.toLocaleString()} (${bp.retailer?.retailer})`;
      }, highlight: (v, w) => bestPrice(w).cost === minPrice
    },
    { label:'🏆 פרסים', val: w => w.awards.length > 0 ? w.awards[0] : '—' },

  return (
    <div className="overlay" onClick={onClose}>

          <div style={{overflowX:'auto'}}>
            <table>
              <thead>
                <tr>
                  <th style={{width:150}}>פרמטר</th>
                  {whiskies.map(w=>(
                    <th key={w.id}>
                      <div>{w.name}</div>
                      <div style={{fontWeight:400,fontSize:'.7rem',color:'#9a7c5a'}}>{COUNTRY_FLAG[w.country]||''} {w.country}</div>

              </thead>
              <tbody>
                {rows.map(row=>(
                  <tr key={row.label}>
                    <td style={{color:'#9a7c5a',fontWeight:600}}>{row.label}</td>

/* ── MAIN APP ── */
const DEFAULT_FILTERS = {
  search:'', types:[], countries:[], regions:[], flavors:[], casks:[],
  minAge:0, maxAge:35, minAbv:40, maxAbv:65,
  maxPrice:3000, minRating:80, includeNAS:true
};

function App() {
  const [filters, setFilters] = useState(DEFAULT_FILTERS);
  const [sort, setSort] = useState('rating');
  const [selected, setSelected] = useState(null);
  const [compare, setCompare] = useState([]);
  const [compareOpen, setCmpOpen] = useState(false);
  const [sideOpen, setSideOpen] = useState(true);

  const filtered = useMemo(() => {
    let list = DB.filter(w => {
      const bp = bestPrice(w);
      if (filters.search) {
        const q = filters.search.toLowerCase();
        const hit = w.name.toLowerCase().includes(q) || w.distillery.toLowerCase().includes(q) ||
                    w.region.toLowerCase().includes(q) || w.country.toLowerCase().includes(q) ||
                    w.flavor.some(f=>f.toLowerCase().includes(q));
        if (!hit) return false;
      }
      if (filters.types.length && !filters.types.includes(w.type)) return false;
      if (filters.countries.length && !filters.countries.includes(w.country)) return false;
      if (filters.regions.length && !filters.regions.includes(w.region)) return false;
      if (w.age === 0) { if (!filters.includeNAS) return false; }
      else { if (w.age < filters.minAge || w.age > filters.maxAge) return false; }
      if (w.abv < filters.minAbv || w.abv > filters.maxAbv) return false;
      if (bp.cost > filters.maxPrice) return false;
      if (w.rating < filters.minRating) return false;
      if (filters.flavors.length && !filters.flavors.every(f=>w.flavor.includes(f))) return false;
      if (filters.casks.length && !filters.casks.some(c=>w.cask.includes(c))) return false;
      return true;
    });

    return list.sort((a,b) => {
      if (sort==='rating') return b.rating - a.rating;
      if (sort==='price') return bestPrice(a).cost - bestPrice(b).cost;
      if (sort==='age') return (b.age||0) - (a.age||0);
      if (sort==='name') return a.name.localeCompare(b.name,'he');
      if (sort==='abv') return b.abv - a.abv;
      if (sort==='peat') return peatScore(b.flavor) - peatScore(a.flavor);
      return 0;
    });
  }, [filters, sort]);

  function toggleCompare(w) {
    setCompare(c => {
      if (c.find(x=>x.id===w.id)) return c.filter(x=>x.id!==w.id);
      if (c.length >= 3) return c;
      return [...c, w];
    });
  }

  const hasFilters = JSON.stringify(filters) !== JSON.stringify(DEFAULT_FILTERS);

  return (
    <div id="app">
      {/* HEADER */}
      <div style={{background:'#1a0a00',borderBottom:'1px solid #4a2800',padding:'12px 20px',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
        <button onClick={()=>setSideOpen(s=>!s)}
          style={{background:'transparent',border:'1px solid #4a2800',color:'#b89060',borderRadius:6,padding:'5px 9px',cursor:'pointer',fontSize:'1rem'}}>
          ☰
        </button>
        <div style={{fontWeight:800,fontSize:'1.15rem',color:'#d4a017',letterSpacing:'-0.5px'}}>
          🥃 מחסן הוויסקי
        </div>
        <div style={{flex:1}}/>
        <div style={{fontSize:'.75rem',color:'#9a7c5a'}}>
          {filtered.length} / {DB.length} וויסקי
        </div>
        {hasFilters && (
          <button className="ghost-btn" onClick={()=>setFilters(DEFAULT_FILTERS)} style={{fontSize:'.72rem'}}>
            ✕ נקה סינונים
          </button>
        )}
        {/* Sort */}
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:'.75rem',color:'#9a7c5a'}}>מיון:</span>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{width:'auto',minWidth:100}}>
            <option value="rating">דירוג ↓</option>
            <option value="price">מחיר ↑</option>
            <option value="age">גיל ↓</option>
            <option value="name">שם</option>
            <option value="abv">ABV ↓</option>
            <option value="peat">עשן ↓</option>
          </select>
        </div>
      </div>

      {/* BODY */}
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* SIDEBAR */}
        <div className="side-panel"
          style={{
            width: sideOpen ? 240 : 0,
            opacity: sideOpen ? 1 : 0,
            borderInlineEnd: sideOpen ? '1px solid #2d1600' : 'none',
            background:'#1a0a00',
            flexShrink:0
          }}>
          {sideOpen && <FilterPanel filters={filters} setFilters={setFilters} onReset={()=>setFilters(DEFAULT_FILTERS)} />}
        </div>

        {/* GRID */}
        <div style={{flex:1,overflowY:'auto',padding:'16px',paddingBottom: compare.length>0?80:16}}>
          {filtered.length === 0 ? (
            <div style={{textAlign:'center',padding:'60px 20px',color:'#9a7c5a'}}>
              <div style={{fontSize:'2rem',marginBottom:12}}>🥃</div>
              <div style={{fontSize:'1rem',fontWeight:600,marginBottom:6}}>לא נמצאו וויסקי</div>
              <div style={{fontSize:'.82rem'}}>נסה לשנות את הסינונים</div>
              <button className="ghost-btn" style={{marginTop:14}} onClick={()=>setFilters(DEFAULT_FILTERS)}>אפס הכל</button>
            </div>
          ) : (
            <div style={{
              display:'grid',
              gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',
              gap:14
            }}>
              {filtered.map(w=>(
                <WhiskyCard key={w.id} w={w}
                  onOpen={setSelected}
                  onCompare={toggleCompare}
                  inCompare={!!compare.find(x=>x.id===w.id)} />
              ))}
            </div>
          )}
        </div>
      </div>

      {/* MODALS */}
      {selected && <WhiskyModal w={selected} onClose={()=>setSelected(null)} />}
      {compareOpen && compare.length>=2 && <CompareModal whiskies={compare} onClose={()=>setCmpOpen(false)} />}

      {/* COMPARE BAR */}
      <CompareBar
        compare={compare}
        onRemove={w=>setCompare(c=>c.filter(x=>x.id!==w.id))}
        onOpen={()=>setCmpOpen(true)}
        onClear={()=>setCompare([])}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
