services:
  # ── API Web Service ───────────────────────────────────────────────────────────
  - type: web
    name: whisky-hunter-api
    region: frankfurt
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: whisky-hunter-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://whisky-hunter-api.onrender.com
      - key: TYPESENSE_HOST
        sync: false
      - key: TYPESENSE_PORT
        value: "443"
      - key: TYPESENSE_PROTOCOL
        value: https
      - key: TYPESENSE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "WhiskyHunter <noreply@whisky-hunter.com>"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  # ── PostgreSQL (free tier) ────────────────────────────────────────────────────
  - name: whisky-hunter-db
    region: frankfurt
    plan: free
    databaseName: whisky_hunter
    user: whisky_hunter
